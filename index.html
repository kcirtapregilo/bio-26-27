<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Biographie en Réalité Augmentée</title>
<!-- Chargement des moteurs 3D (A-Frame) et Réalité Augmentée (AR.js) -->
<script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
<!-- Scène de Réalité Augmentée -->
<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
<!-- 1. Détection du marqueur personnalisé -->
<a-marker type="pattern" url="marqueur.patt">
<!-- 2. Affichage de la biographie à plat sur le marqueur -->
<a-image
src="biographie.png"
position="0 0.1 0"
rotation="-90 0 0"
width="2"
height="2.8">
</a-image>
</a-marker>
<!-- Caméra du smartphone -->
<a-entity camera></a-entity>
</a-scene>
</body>
</html>
